name: Tag demo contacts

# One-off helper: adds the contacts in the DEMO_CONTACTS secret (a CSV) to the Mailchimp audience
# with the tag in config (mailchimp.send_to_tag). Prints counts only, never names or addresses.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          CONTACTS_CSV: ${{ secrets.DEMO_CONTACTS }}
        run: python -m donorbrief.contacts
